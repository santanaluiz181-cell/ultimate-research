<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" role="img" aria-label="Phanty the Detective Elephant Holding BF: 2023 Clipboard">
  <defs>
    <clipPath id="c-eye-l"><circle cx="122" cy="116" r="8.2"/></clipPath>
    <clipPath id="c-eye-r"><circle cx="164" cy="116" r="8.2"/></clipPath>
    <linearGradient id="c-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <style>
      .c-breathe { animation: cBreathe 4.4s ease-in-out infinite; transform-origin: 140px 145px; }
      .c-head { animation: cHeadNod 4.4s ease-in-out infinite; transform-origin: 140px 116px; }
      .c-ear-l { animation: cEarL 3.8s ease-in-out infinite; transform-origin: 90px 96px; }
      .c-ear-r { animation: cEarR 3.8s ease-in-out infinite; transform-origin: 190px 96px; }
      .c-trunk { animation: cTrunk 3.2s ease-in-out infinite; transform-origin: 135px 132px; }
      .c-blink { animation: cBlink 4.2s ease-in-out infinite; transform-origin: 140px 116px; }
      .c-look { animation: cLook 5.2s ease-in-out infinite; }

      @keyframes cBreathe {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50% { transform: translateY(-2.2px) scale(1.015, 1.02); }
      }
      @keyframes cHeadNod {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-1deg); }
      }
      @keyframes cEarL {
        0%, 82%, 100% { transform: rotate(0deg); }
        86% { transform: rotate(-7deg); }
        92% { transform: rotate(3deg); }
      }
      @keyframes cEarR {
        0%, 80%, 100% { transform: rotate(0deg); }
        84% { transform: rotate(7deg); }
        90% { transform: rotate(-3deg); }
      }
      @keyframes cTrunk {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-4deg); }
      }
      @keyframes cBlink {
        0%, 92%, 96%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.08); }
      }
      @keyframes cLook {
        0%, 25% { transform: translate(0px, 0px); }
        50%, 75% { transform: translate(1.4px, -0.6px); }
        100% { transform: translate(0px, 0px); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="236" rx="64" ry="10" fill="#000000" opacity="0.55"/>

  <g class="c-breathe">
    <!-- Left Ear -->
    <g class="c-ear-l">
      <path d="M100 74 C54 62 38 110 66 142 C84 160 102 150 106 132 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
      <path d="M100 74 C54 62 38 110 66 142 C84 160 102 150 106 132 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M94 84 C62 76 52 112 72 134 C84 144 96 138 100 126 Z" fill="#FFB6C6" opacity="0.65"/>
    </g>

    <!-- Right Ear -->
    <g class="c-ear-r">
      <path d="M180 74 C226 62 242 110 214 142 C196 160 178 150 174 132 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
      <path d="M180 74 C226 62 242 110 214 142 C196 160 178 150 174 132 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M186 84 C218 76 228 112 208 134 C196 144 184 138 180 126 Z" fill="#FFB6C6" opacity="0.65"/>
    </g>

    <!-- Body & Navy Vest -->
    <path d="M94 136 C84 155 90 204 106 220 C120 225 160 225 174 220 C190 204 196 155 186 136 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
    <path d="M94 136 C84 155 90 204 106 220 C120 225 160 225 174 220 C190 204 196 155 186 136 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
    
    <path d="M95 144 C89 162 94 204 110 219 C124 223 156 223 170 219 C186 204 191 162 185 144 L162 142 L140 162 L118 142 Z" fill="#1C2333" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M140 162 L140 221" stroke="#181A20" stroke-width="2.2"/>

    <!-- Head -->
    <g class="c-head">
      <ellipse cx="140" cy="116" rx="44" ry="40" fill="none" stroke="#454A54" stroke-width="5.4"/>
      <ellipse cx="140" cy="116" rx="44" ry="40" fill="#848B98" stroke="#181A20" stroke-width="2.6"/>

      <!-- Cheeks -->
      <ellipse cx="106" cy="128" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>
      <ellipse cx="174" cy="128" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>

      <!-- Left Eye -->
      <g class="c-blink">
        <ellipse cx="122" cy="116" rx="8.2" ry="8.6" fill="#121418"/>
        <g class="c-look">
          <circle cx="119.5" cy="113.2" r="3.2" fill="#FFFFFF"/>
          <circle cx="124.8" cy="118.5" r="1.6" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Right Eye -->
      <g class="c-blink">
        <ellipse cx="164" cy="116" rx="8.2" ry="8.6" fill="#121418"/>
        <g class="c-look">
          <circle cx="161.5" cy="113.2" r="3.2" fill="#FFFFFF"/>
          <circle cx="166.8" cy="118.5" r="1.6" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Golden Monocle -->
      <circle cx="164" cy="116" r="14.5" fill="none" stroke="url(#c-gold)" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="164" cy="116" r="13.2" fill="#38BDF8" opacity="0.14"/>
      <path d="M156 108 A 12 12 0 0 1 172 108" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.65" stroke-linecap="round"/>
      <path d="M178 120 C186 132 185 154 176 168 C173 172 168 174 164 172" fill="none" stroke="url(#c-gold)" stroke-width="1.8" stroke-dasharray="1.5, 2.5" stroke-linecap="round"/>
      <circle cx="164" cy="172" r="2.2" fill="#FACC15"/>

      <!-- Trunk -->
      <g class="c-trunk">
        <path d="M134 124 C134 136 128 148 130 156 C132 162 140 163 144 158 C147 154 144 147 139 145 C137 141 139 133 142 124 Z" fill="none" stroke="#454A54" stroke-width="4.8" stroke-linejoin="round"/>
        <path d="M134 124 C134 136 128 148 130 156 C132 162 140 163 144 158 C147 154 144 147 139 145 C137 141 139 133 142 124 Z" fill="#848B98" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M135 133 Q139 131 142 133" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M134 139 Q138 137 141 139" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- CLIPBOARD HELD IN FRONT (Matches Image 3) -->
    <g transform="translate(112, 148)">
      <!-- Board -->
      <rect x="0" y="0" width="56" height="66" rx="4" fill="#78350F" stroke="#181A20" stroke-width="2.2"/>
      <!-- Silver Clip -->
      <rect x="18" y="-4" width="20" height="8" rx="2" fill="#CBD5E1" stroke="#181A20" stroke-width="1.5"/>
      <circle cx="28" cy="0" r="1.8" fill="#181A20"/>
      <!-- Cream Paper -->
      <rect x="4" y="6" width="48" height="54" rx="2" fill="#FEF3C7" stroke="#181A20" stroke-width="1.2"/>
      <!-- Red Ink Stamp: BF: 2023 -->
      <rect x="8" y="12" width="40" height="24" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="2, 1"/>
      <text x="28" y="24" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="900" fill="#DC2626">BF:</text>
      <text x="28" y="33" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="900" fill="#DC2626">2023</text>
      <!-- Notes lines -->
      <line x1="8" y1="42" x2="48" y2="42" stroke="#92400E" stroke-width="1.2"/>
      <line x1="8" y1="48" x2="42" y2="48" stroke="#92400E" stroke-width="1.2"/>
      <line x1="8" y1="54" x2="36" y2="54" stroke="#92400E" stroke-width="1.2"/>
    </g>

    <!-- Paws Gripping Clipboard -->
    <!-- Left Paw -->
    <ellipse cx="114" cy="182" rx="10" ry="7.5" fill="#848B98" stroke="#181A20" stroke-width="2.2"/>
    <circle cx="118" cy="180" r="1.5" fill="#E2E8F0"/>
    <circle cx="118" cy="184" r="1.5" fill="#E2E8F0"/>

    <!-- Right Paw -->
    <ellipse cx="166" cy="182" rx="10" ry="7.5" fill="#848B98" stroke="#181A20" stroke-width="2.2"/>
    <circle cx="162" cy="180" r="1.5" fill="#E2E8F0"/>
    <circle cx="162" cy="184" r="1.5" fill="#E2E8F0"/>

    <!-- Stubby Feet at Bottom -->
    <path d="M114 220 C114 228 124 228 124 220 Z" fill="#848B98" stroke="#181A20" stroke-width="2"/>
    <path d="M156 220 C156 228 166 228 166 220 Z" fill="#848B98" stroke="#181A20" stroke-width="2"/>
  </g>
</svg>
