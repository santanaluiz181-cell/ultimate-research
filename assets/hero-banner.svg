<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-label="ultimate-research v2.2 hero banner with Phanty the Elephant Detective">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="canon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="contemp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="diff-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-opacity="0.16" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="440"/>
    <line x1="240" y1="0" x2="240" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="560" y1="0" x2="560" y2="440"/>
    <line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="880" y1="0" x2="880" y2="440"/>
    <line x1="1040" y1="0" x2="1040" y2="440"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Top Badges Row -->
  <g transform="translate(60, 42)">
    <!-- Pill 1: Version & Benchmark -->
    <rect width="250" height="28" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#F59E0B" filter="url(#glow)"/>
    <text x="30" y="18" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DRACO #1 BENCHMARK • 77.7</text>

    <!-- Pill 2: Hyperresearch Vault -->
    <g transform="translate(262, 0)">
      <rect width="230" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#38BDF8"/>
      <text x="30" y="18" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">HYPERRESEARCH V8 ENGINE</text>
    </g>

    <!-- Pill 3: Elephant-Goldfish -->
    <g transform="translate(504, 0)">
      <rect width="220" height="28" rx="14" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#C084FC"/>
      <text x="30" y="18" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ELEPHANT-GOLDFISH DUAL</text>
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="60" y="124" fill="url(#brand-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.8">
    ultimate-research
  </text>
  <text x="60" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">
    The Unstoppable Deep Research Engine • DRACO #1 • Wiki Vault • Anti-Slop Split-Horizon • Claim Mutation
  </text>

  <!-- Split-Horizon Graphic Display (Two Cards) -->
  <g transform="translate(60, 198)">
    <!-- Lane A Card: Canonical Pre-2023 -->
    <rect x="0" y="0" width="410" height="155" rx="12" fill="url(#canon-grad)" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.7"/>
    <g transform="translate(22, 24)">
      <circle cx="8" cy="8" r="6" fill="#38BDF8" filter="url(#glow)"/>
      <text x="24" y="12" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">LANE A • [HORIZONTE CANÔNICO: PRÉ-2023]</text>
      <text x="24" y="38" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">after:2010 before:2023</text>
      <text x="24" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Reddit • Stack Overflow • Archived GitHub • Indie Blogs
      </text>
      <text x="24" y="84" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
        ✓ 100% Acervo Humano Autêntico • Zero IA Slop
      </text>
      <text x="24" y="104" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        Cofre Persistente: research/notes/ (Zettelkasten)
      </text>
    </g>

    <!-- Center Lightning / Split Bar -->
    <g transform="translate(422, 48)">
      <rect x="0" y="0" width="28" height="58" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <text x="14" y="36" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" text-anchor="middle">⇄</text>
    </g>

    <!-- Lane B Card: Contemporary Post-2023 -->
    <rect x="462" y="0" width="410" height="155" rx="12" fill="url(#contemp-grad)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.7"/>
    <g transform="translate(484, 24)">
      <circle cx="8" cy="8" r="6" fill="#C084FC" filter="url(#glow)"/>
      <text x="24" y="12" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">LANE B • [PÓS-2023 &amp; DRACO 16-STEPS]</text>
      <text x="24" y="38" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">after:2023 + blocklist.json + ARS</text>
      <text x="24" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Europe PMC • Unpaywall • CrossRef • LexML • DJEN
      </text>
      <text x="24" y="84" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
        ✓ 16 Etapas Adaptativas • Claim Mutation Testing
      </text>
      <text x="24" y="104" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        Uncle Bob Gates • Entailment Estrito
      </text>
    </g>
  </g>

  <!-- Right: Phanty the Dapper Elephant Detective Mascot Card -->
  <g transform="translate(952, 120)">
    <!-- Mascot Container Frame -->
    <rect x="0" y="0" width="188" height="234" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <!-- Screen Header -->
    <rect x="0" y="0" width="188" height="26" rx="14" fill="#1E293B"/>
    <rect x="0" y="14" width="188" height="12" fill="#1E293B"/>
    <circle cx="14" cy="13" r="3" fill="#EF4444"/>
    <circle cx="24" cy="13" r="3" fill="#F59E0B"/>
    <circle cx="34" cy="13" r="3" fill="#10B981"/>
    <text x="50" y="17" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">phanty-detective</text>

    <!-- Elephant Drawing -->
    <g transform="translate(18, 38)">
      <!-- Ground Shadow -->
      <ellipse cx="76" cy="134" rx="56" ry="7" fill="#000000" opacity="0.45"/>

      <!-- Large Left Ear -->
      <path d="M42 46 C16 40 10 70 28 88 C40 100 48 94 50 82 Z" fill="#64748B" stroke="#0F172A" stroke-width="2"/>
      <path d="M38 52 C22 50 18 70 32 82 C38 88 44 84 46 76 Z" fill="#F472B6" opacity="0.4"/>

      <!-- Large Right Ear -->
      <path d="M108 46 C134 40 140 70 122 88 C110 100 102 94 100 82 Z" fill="#64748B" stroke="#0F172A" stroke-width="2"/>
      <path d="M112 52 C128 50 132 70 118 82 C112 88 106 84 104 76 Z" fill="#F472B6" opacity="0.4"/>

      <!-- Elephant Body & Vest -->
      <ellipse cx="76" cy="106" rx="30" ry="24" fill="#475569" stroke="#0F172A" stroke-width="2"/>
      <path d="M62 106 L76 120 L90 106 L76 102 Z" fill="#090D16"/>
      <circle cx="76" cy="110" r="3" fill="#F59E0B"/>

      <!-- Elephant Head -->
      <ellipse cx="76" cy="64" rx="28" ry="26" fill="#64748B" stroke="#0F172A" stroke-width="2"/>

      <!-- Eyes -->
      <circle cx="66" cy="62" r="5.2" fill="#0F172A"/>
      <circle cx="64.5" cy="60.5" r="1.8" fill="#FFFFFF"/>
      <circle cx="67.5" cy="63.5" r="0.8" fill="#FFFFFF"/>

      <circle cx="88" cy="62" r="5.2" fill="#0F172A"/>
      <circle cx="86.5" cy="60.5" r="1.8" fill="#FFFFFF"/>
      <circle cx="89.5" cy="63.5" r="0.8" fill="#FFFFFF"/>

      <!-- Golden Monocle with Chain -->
      <circle cx="88" cy="62" r="9.5" fill="none" stroke="url(#gold-grad)" stroke-width="2.4"/>
      <circle cx="88" cy="62" r="8.5" fill="#38BDF8" opacity="0.2"/>
      <path d="M97 64 C104 72 100 92 92 104" fill="none" stroke="url(#gold-grad)" stroke-width="1.3" stroke-dasharray="2,1.5"/>

      <!-- Trunk with curled tip -->
      <path d="M72 74 C72 88 68 98 70 106 C72 112 78 114 82 110 C85 106 82 100 78 98 C76 94 78 86 80 74 Z" fill="#64748B" stroke="#0F172A" stroke-width="2"/>

      <!-- Detective Hat -->
      <path d="M58 42 C58 32 94 32 94 42 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.8"/>
      <rect x="52" y="40" width="48" height="4" rx="2" fill="#1E293B"/>
      <rect x="60" y="37" width="32" height="3" fill="#F59E0B"/>

      <!-- Clipboard: BF: 2023 -->
      <g transform="translate(10, 80) rotate(-10)">
        <rect x="0" y="0" width="44" height="46" rx="4" fill="#78350F" stroke="#451A03" stroke-width="1.5"/>
        <rect x="14" y="-3" width="16" height="5" rx="2" fill="#CBD5E1"/>
        <rect x="3" y="4" width="38" height="38" rx="2" fill="#FEF3C7"/>
        <rect x="5" y="7" width="34" height="15" rx="3" fill="#DC2626"/>
        <text x="22" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.8" font-weight="900" fill="#FFFFFF">BF: 2023</text>
        <path d="M7 27 H37 M7 32 H31 M7 37 H25" stroke="#92400E" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Bottom Mascot Tag -->
    <rect x="12" y="196" width="164" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="94" y="213" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" fill="#38BDF8">PHANTY • BF: 2023</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="435" width="1200" height="5" fill="url(#diff-grad)"/>
</svg>
