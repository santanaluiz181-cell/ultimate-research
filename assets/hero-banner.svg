<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="ultimate-research v2.2 Official Hero Banner with Phanty the Detective Elephant">
  <defs>
    <clipPath id="hero-banner-clip"><rect width="960" height="280" rx="18"/></clipPath>
    <clipPath id="b-eye-l"><circle cx="732" cy="136" r="8.2"/></clipPath>
    <clipPath id="b-eye-r"><circle cx="774" cy="136" r="8.2"/></clipPath>

    <!-- Deep Ambient Glows -->
    <radialGradient id="terminal-glow" cx="72%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090B0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-glow" cx="24%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090B0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Monocle Gradient -->
    <linearGradient id="gold-monocle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Dark Titanium Background -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C12"/>
      <stop offset="55%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>

    <style>
      .b-ele-breathe { animation: bEleBreathe 4.4s ease-in-out infinite; transform-origin: 754px 165px; }
      .b-ele-head { animation: bEleHeadNod 4.4s ease-in-out infinite; transform-origin: 754px 136px; }
      .b-ear-twitch-l { animation: bEarTwitchL 3.8s ease-in-out infinite; transform-origin: 702px 116px; }
      .b-ear-twitch-r { animation: bEarTwitchR 3.8s ease-in-out infinite; transform-origin: 806px 116px; }
      .b-trunk-alive { animation: bTrunkSniff 3.2s ease-in-out infinite; transform-origin: 747px 152px; }
      .b-paw-type-l { animation: bPawTypeL 0.38s ease-in-out infinite alternate; transform-origin: 718px 206px; }
      .b-paw-type-r { animation: bPawTypeR 0.42s ease-in-out infinite alternate 0.12s; transform-origin: 766px 206px; }
      .b-eye-blink { animation: bEyeBlink 4.2s ease-in-out infinite; transform-origin: 754px 136px; }
      .b-eye-look { animation: bEyeLook 5.2s ease-in-out infinite; }
      .b-screen-flicker { animation: bScreenFlicker 2.8s ease-in-out infinite; }
      .b-cursor-blink { animation: bCursorBlink 0.85s steps(2, start) infinite; }
      .b-bubble-bob { animation: bBubbleBob 3.4s ease-in-out infinite; }
      .b-badge-pulse { animation: bBadgePulse 2.8s ease-in-out infinite; }

      @keyframes bEleBreathe {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50% { transform: translateY(-2.5px) scale(1.015, 1.02); }
      }
      @keyframes bEleHeadNod {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        35% { transform: rotate(-1.2deg) translateY(-1px); }
        70% { transform: rotate(1deg) translateY(-0.5px); }
      }
      @keyframes bEarTwitchL {
        0%, 82%, 100% { transform: rotate(0deg); }
        86% { transform: rotate(-7deg); }
        92% { transform: rotate(3deg); }
      }
      @keyframes bEarTwitchR {
        0%, 80%, 100% { transform: rotate(0deg); }
        84% { transform: rotate(7deg); }
        90% { transform: rotate(-3deg); }
      }
      @keyframes bTrunkSniff {
        0%, 100% { transform: rotate(0deg) scale(1); }
        30% { transform: rotate(-4deg) scale(1.02); }
        60% { transform: rotate(2deg) scale(0.98); }
      }
      @keyframes bPawTypeL {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3.5px); }
      }
      @keyframes bPawTypeR {
        0% { transform: translateY(-3.5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes bEyeBlink {
        0%, 92%, 96%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.08); }
      }
      @keyframes bEyeLook {
        0%, 20% { transform: translate(-1.2px, 0.4px); }
        40%, 65% { transform: translate(-2.4px, 0.8px); }
        75%, 90% { transform: translate(0px, 0px); }
        100% { transform: translate(-1.2px, 0.4px); }
      }
      @keyframes bScreenFlicker {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
        72% { opacity: 0.92; }
      }
      @keyframes bCursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes bBubbleBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.2px); }
      }
      @keyframes bBadgePulse {
        0%, 100% { border-color: #F59E0B; }
        50% { border-color: #FBBF24; }
      }
    </style>
  </defs>

  <g clip-path="url(#hero-banner-clip)">
    <!-- Canvas Base -->
    <rect width="960" height="280" fill="url(#hero-bg)"/>
    <rect width="960" height="280" fill="url(#terminal-glow)"/>
    <rect width="960" height="280" fill="url(#amber-glow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#334155" stroke-opacity="0.14" stroke-width="1">
      <line x1="0" y1="56" x2="960" y2="56"/><line x1="0" y1="112" x2="960" y2="112"/>
      <line x1="0" y1="168" x2="960" y2="168"/><line x1="0" y1="224" x2="960" y2="224"/>
      <line x1="120" y1="0" x2="120" y2="280"/><line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="360" y1="0" x2="360" y2="280"/><line x1="480" y1="0" x2="480" y2="280"/>
      <line x1="600" y1="0" x2="600" y2="280"/>
    </g>

    <!-- Outer Border with Neon Accent -->
    <rect x="1.5" y="1.5" width="957" height="277" rx="17" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2.5"/>

    <!-- ======================================================== -->
    <!-- LEFT TYPOGRAPHY & VALUE PROPOSITION                      -->
    <!-- ======================================================== -->
    <g transform="translate(48, 38)">
      <!-- Top DRACO #1 Badge Pill -->
      <g>
        <rect x="0" y="0" width="288" height="26" rx="13" fill="#1C1814" stroke="#F59E0B" stroke-width="1.3"/>
        <circle cx="14" cy="13" r="4.5" fill="#F59E0B"/>
        <text x="28" y="17.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="900" fill="#FDE047" letter-spacing="0.6">DRACO BENCHMARK #1 · 77.7 PTS</text>
      </g>

      <!-- Main Project Title -->
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1.2">
        ULTIMATE RESEARCH
      </text>

      <!-- Subtitle -->
      <text x="2" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">
        The Unstoppable Deep Research Engine · 16-Step Hyperresearch
      </text>
      
      <!-- Split-Horizon & Vault Details -->
      <text x="2" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">
        Split-Horizon (<tspan fill="#38BDF8" font-weight="700">BF:2023</tspan>) · Zero-Context <tspan fill="#C084FC" font-weight="700">Elephant-Goldfish</tspan> · <tspan fill="#34D399" font-weight="700">Wiki Vault</tspan>
      </text>

      <!-- Interactive Feature Pills -->
      <g transform="translate(0, 162)">
        <g>
          <rect x="0" y="0" width="138" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.3"/>
          <text x="69" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" fill="#BAE6FD">PERSISTENT VAULT</text>
        </g>
        <g transform="translate(148, 0)">
          <rect x="0" y="0" width="144" height="28" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.3"/>
          <text x="72" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" fill="#A7F3D0">OPEN-ACCESS OA</text>
        </g>
        <g transform="translate(302, 0)">
          <rect x="0" y="0" width="154" height="28" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1.3"/>
          <text x="77" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" fill="#FECDD3">CLAIM MUTATION</text>
        </g>
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- SPEECH BUBBLE ABOVE PHANTY                               -->
    <!-- ======================================================== -->
    <g transform="translate(680, 24)" class="b-bubble-bob">
      <rect x="0" y="0" width="220" height="32" rx="9" fill="#1C1814" stroke="#F59E0B" stroke-width="1.6"/>
      <path d="M78 32 L86 42 L94 32 Z" fill="#1C1814" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="110" y="20.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="900" fill="#FDE047">BF: 2023 · Memória Infinita!</text>
    </g>

    <!-- Desk Surface & Floor -->
    <g>
      <path d="M520 220 L660 176 L960 176 L960 280 L520 280 Z" fill="#080A0E"/>
      <path d="M520 220 L660 176 L960 176 L960 206 L520 250 Z" fill="#151922" stroke="#252C3B" stroke-width="1.8"/>
    </g>

    <!-- ======================================================== -->
    <!-- RIGHT: PHANTY TYPING AT RETRO TERMINAL (Matches Image 1)  -->
    <!-- ======================================================== -->
    <g class="b-ele-breathe">
      <!-- Ground Shadow -->
      <ellipse cx="760" cy="204" rx="66" ry="12" fill="#000000" opacity="0.6"/>

      <!-- OUTER STICKER CONTOUR: Left Ear -->
      <g class="b-ear-twitch-l">
        <path d="M714 94 C668 82 652 130 680 162 C698 180 716 170 720 152 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <path d="M714 94 C668 82 652 130 680 162 C698 180 716 170 720 152 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M708 104 C676 96 666 132 686 154 C698 164 710 158 714 146 Z" fill="#FFB6C6" opacity="0.65"/>
      </g>

      <!-- OUTER STICKER CONTOUR: Right Ear -->
      <g class="b-ear-twitch-r">
        <path d="M794 94 C840 82 856 130 828 162 C810 180 792 170 788 152 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <path d="M794 94 C840 82 856 130 828 162 C810 180 792 170 788 152 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M800 104 C832 96 842 132 822 154 C810 164 798 158 794 146 Z" fill="#FFB6C6" opacity="0.65"/>
      </g>

      <!-- Chubby Body & Vest -->
      <g>
        <path d="M708 156 C698 175 704 204 720 210 C734 215 774 215 788 210 C804 204 810 175 800 156 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <path d="M708 156 C698 175 704 204 720 210 C734 215 774 215 788 210 C804 204 810 175 800 156 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        
        <!-- Dark Navy Blue Vest -->
        <path d="M709 164 C703 182 708 204 724 209 C738 213 770 213 784 209 C800 204 805 182 799 164 L776 162 L754 182 L732 162 Z" fill="#1C2333" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M754 182 L754 211" stroke="#181A20" stroke-width="2.2"/>
      </g>

      <!-- Elephant Head -->
      <g class="b-ele-head">
        <ellipse cx="754" cy="136" rx="44" ry="40" fill="none" stroke="#454A54" stroke-width="5.4"/>
        <ellipse cx="754" cy="136" rx="44" ry="40" fill="#848B98" stroke="#181A20" stroke-width="2.6"/>

        <!-- Kawaii Pink Cheeks -->
        <ellipse cx="720" cy="148" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>
        <ellipse cx="788" cy="148" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>

        <!-- Left Kawaii Eye -->
        <g class="b-eye-blink">
          <ellipse cx="732" cy="136" rx="8.2" ry="8.6" fill="#121418"/>
          <g class="b-eye-look">
            <circle cx="729.5" cy="133.2" r="3.2" fill="#FFFFFF"/>
            <circle cx="734.8" cy="138.5" r="1.6" fill="#FFFFFF"/>
          </g>
        </g>

        <!-- Right Kawaii Eye -->
        <g class="b-eye-blink">
          <ellipse cx="774" cy="136" rx="8.2" ry="8.6" fill="#121418"/>
          <g class="b-eye-look">
            <circle cx="771.5" cy="133.2" r="3.2" fill="#FFFFFF"/>
            <circle cx="776.8" cy="138.5" r="1.6" fill="#FFFFFF"/>
          </g>
        </g>

        <!-- Golden Monocle (Right Eye) -->
        <g>
          <circle cx="774" cy="136" r="14.5" fill="none" stroke="url(#gold-monocle)" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="774" cy="136" r="13.2" fill="#38BDF8" opacity="0.14"/>
          <path d="M766 128 A 12 12 0 0 1 782 128" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.65" stroke-linecap="round"/>
          
          <!-- Golden Chain -->
          <path d="M788 140 C796 152 795 174 786 188 C783 192 778 194 774 192" fill="none" stroke="url(#gold-monocle)" stroke-width="1.8" stroke-dasharray="1.5, 2.5" stroke-linecap="round"/>
          <circle cx="774" cy="192" r="2.2" fill="#FACC15"/>
        </g>

        <!-- Trunk Alive -->
        <g class="b-trunk-alive">
          <path d="M748 144 C748 156 742 168 744 176 C746 182 754 183 758 178 C761 174 758 167 753 165 C751 161 753 153 756 144 Z" fill="none" stroke="#454A54" stroke-width="4.8" stroke-linejoin="round"/>
          <path d="M748 144 C748 156 742 168 744 176 C746 182 754 183 758 178 C761 174 758 167 753 165 C751 161 753 153 756 144 Z" fill="#848B98" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M749 153 Q753 151 756 153" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M748 159 Q752 157 755 159" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Keyboard & Typing Paws -->
    <g transform="translate(670, 188) rotate(-4)">
      <path d="M0 12 L18 0 L108 0 L90 12 Z" fill="#E2E8F0" stroke="#181A20" stroke-width="2"/>
      <path d="M0 12 L90 12 L90 18 L0 18 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2"/>
      <g stroke="#181A20" stroke-width="1.2" fill="#CBD5E1">
        <rect x="6" y="2" width="7" height="4" rx="1"/>
        <rect x="15" y="2" width="7" height="4" rx="1"/>
        <rect x="24" y="2" width="7" height="4" rx="1"/>
        <rect x="33" y="2" width="7" height="4" rx="1"/>
        <rect x="42" y="2" width="7" height="4" rx="1"/>
        <rect x="51" y="2" width="7" height="4" rx="1"/>
        <rect x="60" y="2" width="7" height="4" rx="1"/>
        <rect x="69" y="2" width="7" height="4" rx="1"/>
        <rect x="78" y="2" width="7" height="4" rx="1"/>
        <rect x="87" y="2" width="7" height="4" rx="1"/>
      </g>
      <path d="M12 2 C-10 -4 -30 4 -48 -8" fill="none" stroke="#181A20" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <g class="b-paw-type-l">
      <ellipse cx="706" cy="198" rx="13" ry="10" fill="#848B98" stroke="#181A20" stroke-width="2.4"/>
      <circle cx="699" cy="203" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="705" cy="204" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="711" cy="203" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
    </g>

    <g class="b-paw-type-r">
      <ellipse cx="766" cy="198" rx="13" ry="10" fill="#848B98" stroke="#181A20" stroke-width="2.4"/>
      <circle cx="759" cy="203" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="765" cy="204" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="771" cy="203" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
    </g>

    <!-- Retro CRT Terminal Computer (Matches Image 1) -->
    <g transform="translate(542, 105)">
      <!-- Desktop PC Case -->
      <g transform="translate(0, 92)">
        <path d="M0 24 L24 0 L126 0 L102 24 Z" fill="#CBD5E1" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M0 24 L102 24 L102 46 L0 46 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M102 24 L126 0 L126 22 L102 46 Z" fill="#64748B" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="58" y="29" width="34" height="4" rx="1" fill="#181A20"/>
        <rect x="86" y="36" width="6" height="3" fill="#10B981"/>
        <line x1="12" y1="28" x2="12" y2="40" stroke="#181A20" stroke-width="1.8"/>
        <line x1="18" y1="28" x2="18" y2="40" stroke="#181A20" stroke-width="1.8"/>
        <line x1="24" y1="28" x2="24" y2="40" stroke="#181A20" stroke-width="1.8"/>
      </g>

      <!-- Monitor -->
      <g>
        <path d="M28 12 L72 -8 L114 8 L70 28 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M72 -8 L114 8 L114 74 L72 58 Z" fill="#64748B" stroke="#181A20" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M8 24 L86 2 L86 92 L8 114 Z" fill="#CBD5E1" stroke="#181A20" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M18 32 L76 14 L76 82 L18 100 Z" fill="#042F2E" stroke="#181A20" stroke-width="2" stroke-linejoin="round"/>
        
        <!-- Glowing Green Phosphor Screen -->
        <g class="b-screen-flicker">
          <path d="M19 34 L75 16 L75 80 L19 98 Z" fill="#064E3B"/>
          <g stroke="#34D399" stroke-width="1.8" stroke-linecap="round">
            <line x1="24" y1="42" x2="54" y2="33"/>
            <line x1="24" y1="50" x2="68" y2="37"/>
            <line x1="24" y1="58" x2="48" y2="51"/>
            <line x1="24" y1="66" x2="62" y2="55"/>
            <line x1="24" y1="74" x2="70" y2="60"/>
            <line x1="24" y1="82" x2="56" y2="73"/>
            <line x1="24" y1="90" x2="42" y2="85"/>
          </g>
          <rect x="44" y="81" width="4.5" height="7" fill="#34D399" class="b-cursor-blink"/>
        </g>
        <path d="M18 108 C12 114 10 120 16 124 L24 124" fill="none" stroke="#181A20" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
