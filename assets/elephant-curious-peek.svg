<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-label="Phanty the Dapper Elephant Detective Typing at Retro Terminal">
  <defs>
    <clipPath id="card-clip"><rect width="420" height="250" rx="18"/></clipPath>
    <clipPath id="eye-clip-l"><circle cx="232" cy="116" r="8.2"/></clipPath>
    <clipPath id="eye-clip-r"><circle cx="274" cy="116" r="8.2"/></clipPath>
    
    <!-- Ambient Terminal Glow -->
    <radialGradient id="crt-glow" cx="28%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Monocle Gradient -->
    <linearGradient id="monocle-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Dark Studio Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="50%" stop-color="#11141E"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>

    <style>
      /* Alive Micro-Animations */
      .ele-breathe { animation: eleBreathe 4.4s ease-in-out infinite; transform-origin: 254px 145px; }
      .ele-head { animation: eleHeadNod 4.4s ease-in-out infinite; transform-origin: 254px 120px; }
      .ear-twitch-l { animation: earTwitchL 3.8s ease-in-out infinite; transform-origin: 202px 96px; }
      .ear-twitch-r { animation: earTwitchR 3.8s ease-in-out infinite; transform-origin: 306px 96px; }
      .trunk-alive { animation: trunkSniff 3.2s ease-in-out infinite; transform-origin: 247px 132px; }
      .paw-type-l { animation: pawTypeL 0.38s ease-in-out infinite alternate; transform-origin: 218px 186px; }
      .paw-type-r { animation: pawTypeR 0.42s ease-in-out infinite alternate 0.12s; transform-origin: 266px 186px; }
      .eye-blink { animation: eyeBlink 4.2s ease-in-out infinite; transform-origin: 254px 116px; }
      .eye-look { animation: eyeLook 5.2s ease-in-out infinite; }
      .screen-flicker { animation: screenFlicker 2.8s ease-in-out infinite; }
      .cursor-blink { animation: cursorBlink 0.85s steps(2, start) infinite; }
      .chain-sway { animation: chainSway 3.6s ease-in-out infinite; transform-origin: 288px 124px; }

      @keyframes eleBreathe {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50% { transform: translateY(-2.2px) scale(1.015, 1.02); }
      }
      @keyframes eleHeadNod {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        35% { transform: rotate(-1deg) translateY(-1px); }
        70% { transform: rotate(1deg) translateY(-0.5px); }
      }
      @keyframes earTwitchL {
        0%, 82%, 100% { transform: rotate(0deg); }
        86% { transform: rotate(-7deg); }
        92% { transform: rotate(3deg); }
        96% { transform: rotate(-1deg); }
      }
      @keyframes earTwitchR {
        0%, 80%, 100% { transform: rotate(0deg); }
        84% { transform: rotate(7deg); }
        90% { transform: rotate(-3deg); }
        95% { transform: rotate(1deg); }
      }
      @keyframes trunkSniff {
        0%, 100% { transform: rotate(0deg) scale(1); }
        30% { transform: rotate(-4deg) scale(1.02); }
        60% { transform: rotate(2deg) scale(0.98); }
      }
      @keyframes pawTypeL {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3.5px); }
      }
      @keyframes pawTypeR {
        0% { transform: translateY(-3.5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes eyeBlink {
        0%, 92%, 96%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.08); }
      }
      @keyframes eyeLook {
        0%, 20% { transform: translate(-1.2px, 0.4px); }
        40%, 65% { transform: translate(-2.4px, 0.8px); }
        75%, 90% { transform: translate(0px, 0px); }
        100% { transform: translate(-1.2px, 0.4px); }
      }
      @keyframes screenFlicker {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
        72% { opacity: 0.92; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes chainSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(4deg); }
      }
    </style>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Card Background -->
    <rect width="420" height="250" fill="url(#bg-grad)"/>
    <rect width="420" height="250" fill="url(#crt-glow)"/>

    <!-- Subtle Tech Grid Lines -->
    <g stroke="#1E293B" stroke-opacity="0.25" stroke-width="0.8">
      <line x1="0" y1="50" x2="420" y2="50"/><line x1="0" y1="100" x2="420" y2="100"/>
      <line x1="0" y1="150" x2="420" y2="150"/><line x1="0" y1="200" x2="420" y2="200"/>
      <line x1="70" y1="0" x2="70" y2="250"/><line x1="140" y1="0" x2="140" y2="250"/>
      <line x1="210" y1="0" x2="210" y2="250"/><line x1="280" y1="0" x2="280" y2="250"/>
      <line x1="350" y1="0" x2="350" y2="250"/>
    </g>

    <!-- Card Border -->
    <rect x="1.5" y="1.5" width="417" height="247" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

    <!-- Top Badge Tag -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="168" height="22" rx="11" fill="#161F30" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="12" cy="11" r="3.5" fill="#34D399"/>
      <text x="22" y="14.8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="800" fill="#38BDF8" letter-spacing="0.4">PHANTY · BF:2023 DORK</text>
    </g>

    <!-- Speech Tag / Bubble -->
    <g transform="translate(254, 16)">
      <rect x="0" y="0" width="148" height="22" rx="11" fill="#1C1824" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="74" y="14.8" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="800" fill="#FDE047">Elefante Nunca Esquece!</text>
    </g>

    <!-- Desk Surface (Isometric Perspective matching Image 1) -->
    <g>
      <!-- Desk Shadow -->
      <path d="M0 205 L150 160 L420 160 L420 250 L0 250 Z" fill="#0A0C11"/>
      <!-- Desk Top Plate -->
      <path d="M0 205 L150 160 L420 160 L420 190 L0 235 Z" fill="#171A23" stroke="#252B3B" stroke-width="1.8"/>
      <!-- Desk Front Edge -->
      <path d="M0 235 L420 190 L420 250 L0 250 Z" fill="#10121A"/>
      <!-- Desk Leg Support -->
      <rect x="290" y="196" width="14" height="54" fill="#0B0D14" stroke="#1F2432" stroke-width="1.5"/>
      <rect x="310" y="192" width="14" height="58" fill="#0B0D14" stroke="#1F2432" stroke-width="1.5"/>
    </g>

    <!-- ======================================================== -->
    <!-- PHANTY THE ELEPHANT MASCOT (Matches Image 1 Exactly)    -->
    <!-- ======================================================== -->
    <g class="ele-breathe">
      <!-- Ground / Chair Shadow -->
      <ellipse cx="260" cy="188" rx="64" ry="12" fill="#000000" opacity="0.6"/>

      <!-- OUTER STICKER CONTOUR (Dark Grey Outline #454A54, width 5.2) -->
      <!-- Left Ear (Outer Contour) -->
      <g class="ear-twitch-l">
        <path d="M214 74 C168 62 152 110 180 142 C198 160 216 150 220 132 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <!-- Inner Ear Fill + Black Stroke -->
        <path d="M214 74 C168 62 152 110 180 142 C198 160 216 150 220 132 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- Soft Pink Inner Ear -->
        <path d="M208 84 C176 76 166 112 186 134 C198 144 210 138 214 126 Z" fill="#FFB6C6" opacity="0.65"/>
      </g>

      <!-- Right Ear (Outer Contour) -->
      <g class="ear-twitch-r">
        <path d="M294 74 C340 62 356 110 328 142 C310 160 292 150 288 132 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <!-- Inner Ear Fill + Black Stroke -->
        <path d="M294 74 C340 62 356 110 328 142 C310 160 292 150 288 132 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- Soft Pink Inner Ear -->
        <path d="M300 84 C332 76 342 112 322 134 C310 144 298 138 294 126 Z" fill="#FFB6C6" opacity="0.65"/>
      </g>

      <!-- Chubby Body & Vest -->
      <g>
        <!-- Body Base Outer Contour -->
        <path d="M208 136 C198 155 204 184 220 190 C234 195 274 195 288 190 C304 184 310 155 300 136 Z" fill="none" stroke="#454A54" stroke-width="5.4" stroke-linejoin="round"/>
        <path d="M208 136 C198 155 204 184 220 190 C234 195 274 195 288 190 C304 184 310 155 300 136 Z" fill="#848B98" stroke="#181A20" stroke-width="2.6" stroke-linejoin="round"/>
        
        <!-- Dark Navy Blue Vest (Matches Image 1) -->
        <path d="M209 144 C203 162 208 184 224 189 C238 193 270 193 284 189 C300 184 305 162 299 144 L276 142 L254 162 L232 142 Z" fill="#1C2333" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- Lapel Split Line -->
        <path d="M254 162 L254 191" stroke="#181A20" stroke-width="2.2"/>
      </g>

      <!-- Elephant Head (With Head Nod Animation) -->
      <g class="ele-head">
        <!-- Head Contour -->
        <ellipse cx="254" cy="116" rx="44" ry="40" fill="none" stroke="#454A54" stroke-width="5.4"/>
        <ellipse cx="254" cy="116" rx="44" ry="40" fill="#848B98" stroke="#181A20" stroke-width="2.6"/>

        <!-- Kawaii Pink Cheeks -->
        <ellipse cx="220" cy="128" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>
        <ellipse cx="288" cy="128" rx="8.5" ry="4.5" fill="#FF8CA3" opacity="0.85"/>

        <!-- Left Kawaii Eye (Behind Terminal Glow) -->
        <g class="eye-blink">
          <ellipse cx="232" cy="116" rx="8.2" ry="8.6" fill="#121418"/>
          <!-- Pupil Looking Around -->
          <g class="eye-look">
            <!-- Large Primary White Catchlight -->
            <circle cx="229.5" cy="113.2" r="3.2" fill="#FFFFFF"/>
            <!-- Secondary Smaller Catchlight -->
            <circle cx="234.8" cy="118.5" r="1.6" fill="#FFFFFF"/>
          </g>
        </g>

        <!-- Right Kawaii Eye (With Dapper Monocle) -->
        <g class="eye-blink">
          <ellipse cx="274" cy="116" rx="8.2" ry="8.6" fill="#121418"/>
          <g class="eye-look">
            <circle cx="271.5" cy="113.2" r="3.2" fill="#FFFFFF"/>
            <circle cx="276.8" cy="118.5" r="1.6" fill="#FFFFFF"/>
          </g>
        </g>

        <!-- Golden Monocle (Right Eye - Matches Images 1, 2, 3) -->
        <g>
          <!-- Outer Gold Rim -->
          <circle cx="274" cy="116" r="14.5" fill="none" stroke="url(#monocle-gold)" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="274" cy="116" r="13.2" fill="#38BDF8" opacity="0.14"/>
          <!-- Glare highlight on monocle glass -->
          <path d="M266 108 A 12 12 0 0 1 282 108" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.65" stroke-linecap="round"/>
          
          <!-- Golden Chain Draping Down to Vest -->
          <g class="chain-sway">
            <path d="M288 120 C296 132 295 154 286 168 C283 172 278 174 274 172" fill="none" stroke="url(#monocle-gold)" stroke-width="1.8" stroke-dasharray="1.5, 2.5" stroke-linecap="round"/>
            <circle cx="274" cy="172" r="2.2" fill="#FACC15"/>
          </g>
        </g>

        <!-- Trunk with Alive Sniffing Animation (Matches Images 1, 2, 3) -->
        <g class="trunk-alive">
          <!-- Trunk Outer Contour -->
          <path d="M248 124 C248 136 242 148 244 156 C246 162 254 163 258 158 C261 154 258 147 253 145 C251 141 253 133 256 124 Z" fill="none" stroke="#454A54" stroke-width="4.8" stroke-linejoin="round"/>
          <path d="M248 124 C248 136 242 148 244 156 C246 162 254 163 258 158 C261 154 258 147 253 145 C251 141 253 133 256 124 Z" fill="#848B98" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
          
          <!-- Horizontal Wrinkle Creases on Trunk -->
          <path d="M249 133 Q253 131 256 133" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M248 139 Q252 137 255 139" stroke="#181A20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Little Chubby Feet at Bottom -->
      <path d="M228 188 C228 196 238 196 238 188 Z" fill="#848B98" stroke="#181A20" stroke-width="2"/>
      <path d="M270 188 C270 196 280 196 280 188 Z" fill="#848B98" stroke="#181A20" stroke-width="2"/>
    </g>

    <!-- ======================================================== -->
    <!-- RETRO MECHANICAL KEYBOARD & TYPING PAWS (Image 1)        -->
    <!-- ======================================================== -->
    <g transform="translate(170, 168) rotate(-4)">
      <!-- Keyboard Base Angle -->
      <path d="M0 12 L18 0 L108 0 L90 12 Z" fill="#E2E8F0" stroke="#181A20" stroke-width="2"/>
      <path d="M0 12 L90 12 L90 18 L0 18 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2"/>
      <!-- Key Rows -->
      <g stroke="#181A20" stroke-width="1.2" fill="#CBD5E1">
        <rect x="6" y="2" width="7" height="4" rx="1"/>
        <rect x="15" y="2" width="7" height="4" rx="1"/>
        <rect x="24" y="2" width="7" height="4" rx="1"/>
        <rect x="33" y="2" width="7" height="4" rx="1"/>
        <rect x="42" y="2" width="7" height="4" rx="1"/>
        <rect x="51" y="2" width="7" height="4" rx="1"/>
        <rect x="60" y="2" width="7" height="4" rx="1"/>
        <rect x="69" y="2" width="7" height="4" rx="1"/>
        <rect x="78" y="2" width="7" height="4" rx="1"/>
        <rect x="87" y="2" width="7" height="4" rx="1"/>

        <rect x="8" y="7" width="8" height="4" rx="1"/>
        <rect x="18" y="7" width="8" height="4" rx="1"/>
        <rect x="28" y="7" width="8" height="4" rx="1"/>
        <rect x="38" y="7" width="22" height="4" rx="1" fill="#94A3B8"/> <!-- Spacebar -->
        <rect x="62" y="7" width="8" height="4" rx="1"/>
        <rect x="72" y="7" width="8" height="4" rx="1"/>
        <rect x="82" y="7" width="8" height="4" rx="1"/>
      </g>

      <!-- Keyboard Cable to Computer -->
      <path d="M12 2 C-10 -4 -30 4 -48 -8" fill="none" stroke="#181A20" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Typing Paws (Animated Alternating Keypress) -->
    <!-- Left Paw -->
    <g class="paw-type-l">
      <ellipse cx="206" cy="178" rx="13" ry="10" fill="#848B98" stroke="#181A20" stroke-width="2.4"/>
      <!-- Little Toenails -->
      <circle cx="199" cy="183" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="205" cy="184" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="211" cy="183" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
    </g>

    <!-- Right Paw -->
    <g class="paw-type-r">
      <ellipse cx="266" cy="178" rx="13" ry="10" fill="#848B98" stroke="#181A20" stroke-width="2.4"/>
      <!-- Little Toenails -->
      <circle cx="259" cy="183" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="265" cy="184" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
      <circle cx="271" cy="183" r="2.2" fill="#E2E8F0" stroke="#181A20" stroke-width="1.2"/>
    </g>

    <!-- ======================================================== -->
    <!-- RETRO CRT COMPUTER & MONITOR (Matches Image 1 Exactly)   -->
    <!-- ======================================================== -->
    <g transform="translate(42, 85)">
      <!-- Desktop PC Case Unit (Under Monitor) -->
      <g transform="translate(0, 92)">
        <path d="M0 24 L24 0 L126 0 L102 24 Z" fill="#CBD5E1" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M0 24 L102 24 L102 46 L0 46 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M102 24 L126 0 L126 22 L102 46 Z" fill="#64748B" stroke="#181A20" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- Floppy Drive Slot -->
        <rect x="58" y="29" width="34" height="4" rx="1" fill="#181A20"/>
        <rect x="86" y="36" width="6" height="3" fill="#10B981"/> <!-- Green LED -->
        <!-- Air Vents -->
        <line x1="12" y1="28" x2="12" y2="40" stroke="#181A20" stroke-width="1.8"/>
        <line x1="18" y1="28" x2="18" y2="40" stroke="#181A20" stroke-width="1.8"/>
        <line x1="24" y1="28" x2="24" y2="40" stroke="#181A20" stroke-width="1.8"/>
      </g>

      <!-- CRT Monitor Housing (3D Angled View) -->
      <g>
        <!-- Monitor Back Housing (Deep Tapered Box) -->
        <path d="M28 12 L72 -8 L114 8 L70 28 Z" fill="#94A3B8" stroke="#181A20" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M72 -8 L114 8 L114 74 L72 58 Z" fill="#64748B" stroke="#181A20" stroke-width="2.2" stroke-linejoin="round"/>
        
        <!-- Monitor Front Bezel -->
        <path d="M8 24 L86 2 L86 92 L8 114 Z" fill="#CBD5E1" stroke="#181A20" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Inner CRT Screen Cutout -->
        <path d="M18 32 L76 14 L76 82 L18 100 Z" fill="#042F2E" stroke="#181A20" stroke-width="2" stroke-linejoin="round"/>
        
        <!-- Glowing Green CRT Phosphor Screen (Animated Flicker) -->
        <g class="screen-flicker">
          <path d="M19 34 L75 16 L75 80 L19 98 Z" fill="#064E3B"/>
          <!-- Matrix / Dork Code Lines on Screen -->
          <g stroke="#34D399" stroke-width="1.8" stroke-linecap="round">
            <line x1="24" y1="42" x2="54" y2="33"/>
            <line x1="24" y1="50" x2="68" y2="37"/>
            <line x1="24" y1="58" x2="48" y2="51"/>
            <line x1="24" y1="66" x2="62" y2="55"/>
            <line x1="24" y1="74" x2="70" y2="60"/>
            <line x1="24" y1="82" x2="56" y2="73"/>
            <line x1="24" y1="90" x2="42" y2="85"/>
          </g>
          <!-- Green Blinking Cursor -->
          <rect x="44" y="81" width="4.5" height="7" fill="#34D399" class="cursor-blink"/>
        </g>

        <!-- Power Cable from Monitor to Desktop Unit -->
        <path d="M18 108 C12 114 10 120 16 124 L24 124" fill="none" stroke="#181A20" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
