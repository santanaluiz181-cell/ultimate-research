[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-research"
version = "2.1.0"
description = "Clean web search utility, Split-Horizon comparative engine, CLI, and AI Agent Skill engine that filters synthetic SEO slop via temporal dorks (before:2023), community routing, and heuristic text classification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Antigravity Engineering / Ultimate Research Contributors" }
]
keywords = ["ultimate-research", "search", "dorks", "before-2023", "dead-internet", "anti-slop", "ai-skill", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed"
]
dependencies = []

[project.scripts]
ultimate-research-py = "deslop_search.cli:main"
deslop-py = "deslop_search.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
deslop_search = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "python"

[tool.ruff]
line-length = 100
target-version = "py310"
